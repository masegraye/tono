# Serves the web app and tells it, live, how the desktop is themed.
product: jvm/app

repositories:
  - mavenLocal # for the omarchy-theme libraries

dependencies:
  - $libs.omarchy.theme.ktor
  - $ktor.server.core
  - $ktor.server.netty
  - $libs.logback.classic

settings:
  ktor: enabled
  jvm:
    mainClass: org.example.kotlintest.server.ApplicationKt

test-dependencies:
  - $ktor.server.testHost
