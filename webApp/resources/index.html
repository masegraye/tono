<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- interactive-widget: where a browser offers the choice, a keyboard on the screen makes the page shorter instead of covering it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>Tono</title>
    <!-- Lets a browser install the page as an app with a window of its own, which gets the keys a tab doesn't. -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0b1522">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body style="text-align: center; align-content: center">
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
    <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
    <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"
            stroke-dasharray="90 125">
        <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                          repeatCount="indefinite"/>
    </circle>
</svg>
<!-- The terminal library's other half: see the top of the file. -->
<script src="ghostty-glue.js"></script>
<script src="page-keys.js"></script>
<script src="dev-reload.js"></script>
{{kotlin.scripts}}
</body>
</html>
