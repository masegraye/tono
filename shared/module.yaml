product:
  type: kmp/lib
  platforms: [android, iosArm64, iosSimulatorArm64, jvm, wasmJs]

repositories:
  - mavenLocal # for the omarchy-theme libraries

dependencies:
  - $libs.omarchy.theme.compose: exported
  - $compose.runtime
  - $libs.compose.material.icons.core
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose

dependencies@android:
  - $compose.uiTooling

settings:
  compose:
    enabled: true
    resources:
      packageName: org.example.kotlintest.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true

# Skia runtime for the offscreen render tests in test@jvm
test-dependencies@jvm:
  - $compose.desktop.currentOs
