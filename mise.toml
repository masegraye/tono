# The tools this project needs beyond the Kotlin Toolchain, which ./kotlin provisions itself.
# `mise install` gets them; the tasks are in Taskfile.yml.
[tools]
task = "3.53.1"                   # runs the tasks: `task` lists them
java = "temurin-25.0.5+8.0.LTS"   # runs the packaged server jar, and jextract
zig = "0.17.1"                    # builds libghostty-vt (see native/)
