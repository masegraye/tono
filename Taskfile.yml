# Everything you run in this project. `task` lists the tasks; `task <name>` runs one.
#
# Task itself comes from mise (see mise.toml), and so do the Java and Zig a few tasks need.
# Those tasks run their commands through `mise exec`, so they get the pinned versions
# whether or not your shell has mise activated.
# https://taskfile.dev
version: '3'

vars:
  # The terminal emulator is a native library, called through Java's foreign function API,
  # and the window is given a class of its own, for which the toolkit has to be opened.
  NATIVE_ACCESS: '--jvm-args="--enable-native-access=ALL-UNNAMED --add-opens=java.desktop/sun.awt.X11=ALL-UNNAMED"'

tasks:
  default:
    desc: List the tasks
    silent: true
    cmds:
      - '{{.TASK_EXE}} --list'

  # --- Tono, the desktop app ---

  desktop:
    desc: Run Tono with Compose Hot Reload (options go after --, such as -- --workspace FILE)
    deps: [native]
    cmds:
      - ./kotlin run -m desktopApp {{.NATIVE_ACCESS}} -- {{.CLI_ARGS}}

  desktop:steady:
    desc: Run Tono without Hot Reload, so that building doesn't change the app you are using
    deps: [native]
    cmds:
      - ./kotlin run -m desktopApp --no-compose-hot-reload {{.NATIVE_ACCESS}} -- {{.CLI_ARGS}}

  package:
    desc: Build Tono as a single runnable jar
    deps: [native]
    cmds:
      - ./kotlin package -m desktopApp -f executable-jar

  install:
    desc: Install the `tono` command for you (~/.local/bin/tono; the app goes in ~/.local/share/tono)
    deps: [package]
    cmds:
      - mise exec -- packaging/install.sh

  uninstall:
    desc: Remove the `tono` command and the installed app (your hosts and settings are kept)
    cmds:
      - rm -f "$HOME/.local/bin/tono" "${XDG_DATA_HOME:-$HOME/.local/share}/applications/tono.desktop"
      - find "${XDG_DATA_HOME:-$HOME/.local/share}/icons/hicolor" -path '*/apps/tono.*' -delete 2>/dev/null || true
      - rm -rf "${XDG_DATA_HOME:-$HOME/.local/share}/tono"

  probe:
    desc: Connect to every configured Rex server without a window and print what was restored
    deps: [native]
    cmds:
      - ./kotlin run -m rexSpike {{.NATIVE_ACCESS}} -- {{.CLI_ARGS}}

  test:
    desc: Run the tests that run on this machine (JVM and Android)
    deps: [native]
    cmds:
      - ./kotlin test -p jvm -p android {{.CLI_ARGS}}

  # --- libghostty-vt ---

  native:
    desc: Build libghostty-vt, the terminal emulation library, into native/out (two minutes, once)
    cmds:
      - mise exec -- native/build-libghostty-vt.sh

  native:wasm:
    desc: Build libghostty-vt as a WebAssembly module, for the web app, into native/out-wasm
    cmds:
      - mise exec -- native/build-libghostty-vt-wasm.sh

  bindings:
    desc: Regenerate the libghostty-vt bindings in ghostty/src/ffi from native/ghostty-vt.symbols
    deps: [native]
    cmds:
      - native/generate-bindings.sh

  # --- The web app ---

  web:
    desc: Serve Tono for the browser at http://127.0.0.1:8080, to this machine only
    # The server module serves the built web app, and gives it what a page can't get for
    # itself: connections to Rex servers, the terminal library, the desktop's theme and font.
    deps: [native:wasm]
    cmds:
      - ./kotlin build -m webApp
      - WEB_DIR="$PWD/$(dirname "$(find build/tasks -name webApp.wasm -path '*_webApp_build*Debug*' | head -n 1)")" ./kotlin run -m server

  web:tailnet:
    desc: Let your other devices reach the running web Tono, over your tailnet only (stop it with Control+C)
    # Tailscale takes connections from your tailnet alone, over HTTPS with a certificate for
    # this machine's tailnet name, and passes them to the server on this machine's own
    # address. Nothing listens on any other network, and nothing is opened to the internet
    # (that would be `tailscale funnel`, which this never runs).
    cmds:
      - tailscale serve {{.PORT | default "8080"}}

  web:build:
    desc: Build the web app, then tell open browser tabs to reload
    sources:
      - shared/src*/**/*
      - shared/composeResources/**/*
      - omarchy-theme*/src*/**/*
      - tono/src*/**/*
      - rex/src*/**/*
      - ghostty/src*/**/*
      - webApp/src/**/*
      - webApp/resources/**/*
      - '**/module.yaml'
      - project.yaml
      - libs.versions.toml
    cmds:
      - ./kotlin build -m webApp
      # The build id is written only after a successful build, into the directory the dev
      # server serves; webApp/resources/dev-reload.js polls it.
      - date +%s%N > "$(dirname "$(find build/tasks -name webApp.wasm -path '*_webApp_build*Debug*' | head -n 1)")/dev-build-id.txt"

  web:watch:
    desc: Rebuild the web app on every source change (run next to `task web`)
    cmds:
      - '{{.TASK_EXE}} web:build --watch --interval 500ms'

  web:release:
    desc: Run the optimized web app from the packaged server jar (set PORT to change the port)
    deps: [native:wasm]
    cmds:
      - ./kotlin build -m webApp -v release
      - ./kotlin package -m server -f executable-jar
      - WEB_DIR="$PWD/build/tasks/_webApp_buildWasmJsAppWasmJsRelease" mise exec -- java -jar build/tasks/_server_executableJarJvm/server-jvm-executable.jar
